<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Your Email</title>
  </head>
  <body style="font-family: Arial, sans-serif; background: #f4f6fb; margin: 0; padding: 32px; color: #1f2937;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px;">
      <h2 style="margin-top: 0; color: #111827;">Hello {{FirstName}},</h2>
      <p>Thank you for registering with QuickWatch.</p>
      <p>Please verify your email address before logging in.</p>
      <p><a href="{{VerificationLink}}" style="display: inline-block; background: #2563eb; color: #fff; text-decoration: none; padding: 12px 18px; border-radius: 8px;">Verify my email</a></p>
      <p>This link expires in 24 hours.</p>
      <p>Regards,<br />QuickWatch</p>
    </div>
  </body>
</html>
