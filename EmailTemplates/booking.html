<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking Request Created</title>
  </head>
  <body style="font-family: Arial, sans-serif; background: #f4f6fb; margin: 0; padding: 32px; color: #1f2937;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px;">
      <h2 style="margin-top: 0; color: #111827;">Hello {{FirstName}},</h2>
      <p>Your babysitting booking request has been created successfully.</p>
      <p><strong>Babysitter:</strong> {{BabysitterName}}</p>
      <p><strong>Date:</strong> {{BookingDate}}</p>
      <p><strong>Time:</strong> {{BookingTime}}</p>
      <p><strong>Location:</strong> {{Location}}</p>
      <p>You will receive updates once the booking is reviewed or confirmed.</p>
      <p>Regards,<br />QuickWatch</p>
    </div>
  </body>
</html>
