<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Status Update</title>
  </head>
  <body style="font-family: Arial, sans-serif; background: #f4f6fb; margin: 0; padding: 32px; color: #1f2937;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px;">
      <h2 style="margin-top: 0; color: #111827;">Hello {{FirstName}},</h2>
      <p>Your QuickWatch account has been updated to a suspended status.</p>
      <p><strong>Reason:</strong> {{Reason}}</p>
      <p>Please contact support for more information or to resolve this issue.</p>
      <p>Regards,<br />QuickWatch</p>
    </div>
  </body>
</html>
