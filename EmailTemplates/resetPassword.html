<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Your Password</title>
  </head>
  <body style="font-family: Arial, sans-serif; background: #f4f6fb; margin: 0; padding: 32px; color: #1f2937;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px;">
      <h2 style="margin-top: 0; color: #111827;">Password Reset Request</h2>
      <p>We received a request to reset your password.</p>
      <p>Click the link below to set a new password:</p>
      <p><a href="{{ResetLink}}" style="display: inline-block; background: #2563eb; color: #fff; text-decoration: none; padding: 12px 18px; border-radius: 8px;">Reset Password</a></p>
      <p>If you did not request this, you can ignore this email.</p>
      <p>Regards,<br />QuickWatch</p>
    </div>
  </body>
</html>
